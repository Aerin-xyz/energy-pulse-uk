name: Refresh operational GB asset catalogue
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: energy-mix-data-publisher
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: npm ci
      - run: npm run ingest:catalogue
      - run: node --test tests/operational-assets.test.mjs
      - name: Publish validated catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/operational-assets.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh operational GB asset catalogue"
            git push
          fi
