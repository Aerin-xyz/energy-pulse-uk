name: Refresh mapped network geography
on:
  schedule:
    - cron: '37 4 1 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: energy-mix-data-publisher
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 scripts/fetch-network-geography.py
      - run: node scripts/build-network-geography.mjs
      - run: node --test tests/network-geography.test.mjs
      - name: Publish validated geography
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/network-geography.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh mapped GB network geography"
            git push
          fi
